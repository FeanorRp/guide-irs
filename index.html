<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guide IRS - San Andreas</title>
  <meta name="description" content="Guide de l'Internal Revenue Service : code entreprises, impôts, fiscalité, droits du contribuable.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <button class="menu-btn" id="menuBtn" aria-label="Ouvrir le menu">Menu</button>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">
      <span class="brand-logo">IRS</span>
      <span class="brand-text">Internal Revenue Service<small>San Andreas</small></span>
    </a>
    <nav id="nav"></nav>
    <button class="search-open" id="searchOpen">Rechercher <kbd>Ctrl K</kbd></button>
  </aside>

  <main class="main" id="main" tabindex="-1"></main>

  <div class="modal" id="searchModal" hidden>
    <div class="modal-box" role="dialog" aria-label="Recherche globale">
      <input id="globalSearch" type="search" placeholder="Rechercher dans tout le guide..." autocomplete="off">
      <ul id="globalResults"></ul>
    </div>
  </div>

  <script src="assets/data.js"></script>
  <script src="assets/app.js"></script>

</html>
